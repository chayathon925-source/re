<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชยธร โภคา นายอัครชา ภมรบุตร - เลขที่ 19/15</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050003;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas สำหรับวาดเปลวไฟ */
        #fireCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* การ์ดแสดงข้อมูลตรงกลาง */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 2, 10, 0.75);
            border: 2px solid #ff1493;
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(255, 20, 147, 0.8), 
                        inset 0 0 20px rgba(255, 20, 147, 0.5);
            text-align: center;
            backdrop-filter: blur(8px);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 25px rgba(255, 20, 147, 0.6), inset 0 0 15px rgba(255, 20, 147, 0.4);
                transform: translateY(0);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 105, 180, 0.9), inset 0 0 30px rgba(255, 105, 180, 0.7);
                transform: translateY(-5px);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4;
            letter-spacing: 2px;
        }

        .info {
            color: #ffe6f2;
            font-size: 22px;
            margin: 12px 0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .info span {
            color: #ff69b4;
            font-weight: bold;
            font-size: 26px;
            text-shadow: 0 0 12px #ff1493, 0 0 25px #ff69b4;
        }
    </style>
</head>
<body>

    <!-- Canvas วาดเปลวไฟ -->
    <canvas id="fireCanvas"></canvas>

    <!-- การ์ดข้อความ -->
    <div class="card">
        <h1>🔥 PINK FIRE STUDENT 🔥</h1>
        <div class="info">ชื่อ-นามสกุล: <span>ชยธร โภคา</span></div>
        <div class="info">เลขที่: <span>19</span></div>
    </div>

    <script>
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 250;

        class FireParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.speedY = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 25 + 10;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                const colors = ['#ff007f', '#ff1493', '#ff69b4', '#ffb6c1', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.05) * 0.5;
                this.size -= 0.15;
                this.alpha -= this.decay;

                if (this.alpha <= 0 || this.size <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#ff1493';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(this.size, 0), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new FireParticle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 0, 3, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
